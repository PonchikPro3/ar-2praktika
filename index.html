<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>AR — управление моделями</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <div id="viewport"></div>
  <main id="overlay">
    <section id="start-screen" data-ui>
      <h1>AR — управление моделями</h1>
      <p>Найдите пол или стол и коснитесь экрана, когда появится кольцо. В AR можно выбрать модель и повернуть её.</p>
      <button id="start-ar" disabled>Загрузка…</button>
      <p id="support" role="status">Загружаем модель и HDRI, проверяем WebXR.</p>
    </section>
    <section id="ar-hud" hidden aria-label="Управление AR">
      <button id="end-ar" data-ui>Выйти из AR</button>
      <div class="bottom-panel" data-ui>
        <p id="ar-status" role="status">Медленно двигайте телефон, чтобы найти поверхность</p>
        <label for="model-select">Модель</label>
        <select id="model-select" aria-describedby="model-status"></select>
        <div class="rotation-controls" role="group" aria-label="Поворот модели">
          <button id="rotate-left" aria-label="Повернуть модель влево на 15 градусов">↶ −15°</button>
          <button id="rotate-right" aria-label="Повернуть модель вправо на 15 градусов">+15° ↷</button>
        </div>
        <p id="model-status" role="status"></p>
        <button id="place" disabled>Разместить модель</button>
        <button id="reset" hidden>Разместить заново</button>
      </div>
    </section>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
